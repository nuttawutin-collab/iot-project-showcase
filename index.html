<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d080b">
  <meta name="description" content="นำเสนอ IoT คืออะไร ทั้ง 8 สไลด์ตามไฟล์ต้นฉบับ">
  <title>IoT คืออะไร — Presentation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="deck" id="deck" aria-label="สไลด์นำเสนอ IoT จำนวน 8 หน้า">
    <section class="slide" id="slide-1" aria-label="สไลด์ 1 จาก 8: IoT คืออะไร">
      <img src="slide-01.jpg" alt="IoT คืออะไร สำหรับคนไม่เคยเข้าใจมาก่อน — จัดทำโดย IET28/1 นายณัฐวุฒิ อินาวา; ภาพอุปกรณ์ IoT เชื่อมต่อกับคลาวด์" fetchpriority="high">
    </section>
    <section class="slide" id="slide-2" aria-label="สไลด์ 2 จาก 8: สิ่งของที่เชื่อมต่ออินเทอร์เน็ต">
      <img src="slide-02.jpg" alt="อธิบายแนวคิด IoT ผ่านอุปกรณ์รับรู้ข้อมูล อินเทอร์เน็ต และการสั่งงาน">
    </section>
    <section class="slide" id="slide-3" aria-label="สไลด์ 3 จาก 8: ตัวอย่างอุปกรณ์ IoT รอบตัว">
      <img src="slide-03.jpg" alt="ตัวอย่าง Smart Watch และ Smart Speaker พร้อมคำอธิบายการทำงาน">
    </section>
    <section class="slide" id="slide-4" aria-label="สไลด์ 4 จาก 8: บ้านอัจฉริยะ">
      <img src="slide-04.jpg" alt="ตัวอย่าง Smart Home: หลอดไฟ กล้องวงจรปิด และตู้เย็น พร้อมภาพภายในบ้าน">
    </section>
    <section class="slide" id="slide-5" aria-label="สไลด์ 5 จาก 8: ประโยชน์ของ IoT">
      <img src="slide-05.jpg" alt="ประโยชน์ของ IoT: สั่งงานจากทุกที่ ทำงานตามเงื่อนไข และใช้พลังงานพอดี">
    </section>
    <section class="slide" id="slide-6" aria-label="สไลด์ 6 จาก 8: Smart City">
      <img src="slide-06.jpg" alt="แนวคิด Smart City: ไฟจราจรอัจฉริยะ เซนเซอร์ที่จอดรถ คุณภาพอากาศ และพลังงาน">
    </section>
    <section class="slide" id="slide-7" aria-label="สไลด์ 7 จาก 8: ความปลอดภัยและความเป็นส่วนตัว">
      <img src="slide-07.jpg" alt="ข้อควรพิจารณาก่อนใช้ IoT เรื่องความปลอดภัยและความเป็นส่วนตัว">
    </section>
    <section class="slide" id="slide-8" aria-label="สไลด์ 8 จาก 8: สรุป IoT">
      <img src="slide-08.jpg" alt="สรุป: IoT เชื่อมต่อเพื่อชีวิตที่ดีขึ้น โดยคำนึงถึงความปลอดภัยและความเป็นส่วนตัว">
    </section>
  </main>

  <nav class="presentation-controls" aria-label="ตัวควบคุมสไลด์">
    <button class="control-button" id="previous" type="button" aria-label="สไลด์ก่อนหน้า">←</button>
    <span class="slide-count" aria-live="polite"><span id="current-slide">01</span><span class="count-divider">/</span>08</span>
    <div class="slide-dots" aria-label="เลือกหน้า">
      <button type="button" data-slide="0" aria-label="ไปสไลด์ 1" aria-current="true"></button>
      <button type="button" data-slide="1" aria-label="ไปสไลด์ 2"></button>
      <button type="button" data-slide="2" aria-label="ไปสไลด์ 3"></button>
      <button type="button" data-slide="3" aria-label="ไปสไลด์ 4"></button>
      <button type="button" data-slide="4" aria-label="ไปสไลด์ 5"></button>
      <button type="button" data-slide="5" aria-label="ไปสไลด์ 6"></button>
      <button type="button" data-slide="6" aria-label="ไปสไลด์ 7"></button>
      <button type="button" data-slide="7" aria-label="ไปสไลด์ 8"></button>
    </div>
    <button class="control-button" id="next" type="button" aria-label="สไลด์ถัดไป">→</button>
    <button class="control-button fullscreen-button" id="fullscreen" type="button" aria-label="เต็มหน้าจอ">⛶</button>
  </nav>
  <p class="keyboard-hint">ใช้ปุ่ม ← → เพื่อเปลี่ยนสไลด์</p>
  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const dots = [...document.querySelectorAll('[data-slide]')];
      const counter = document.getElementById('current-slide');
      let active = 0;
      const show = (index) => {
        active = Math.max(0, Math.min(slides.length - 1, index));
        slides[active].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
        counter.textContent = String(active + 1).padStart(2, '0');
        dots.forEach((dot, i) => dot.toggleAttribute('aria-current', i === active));
        dots.forEach((dot, i) => { if (i !== active) dot.removeAttribute('aria-current'); });
      };
      document.getElementById('previous').addEventListener('click', () => show(active - 1));
      document.getElementById('next').addEventListener('click', () => show(active + 1));
      dots.forEach((dot) => dot.addEventListener('click', () => show(Number(dot.dataset.slide))));
      document.getElementById('fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      });
      document.addEventListener('keydown', (event) => {
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(active + 1); }
        if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); show(active - 1); }
        if (event.key === 'Home') show(0);
        if (event.key === 'End') show(slides.length - 1);
      });
      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        active = slides.indexOf(visible.target);
        counter.textContent = String(active + 1).padStart(2, '0');
        dots.forEach((dot, i) => { if (i === active) dot.setAttribute('aria-current', 'true'); else dot.removeAttribute('aria-current'); });
      }, { threshold: [0.55, 0.8] });
      slides.forEach((slide) => observer.observe(slide));
    })();
  </script>
</body>
</html>
